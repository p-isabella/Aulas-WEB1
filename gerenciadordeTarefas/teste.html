<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

  <h1 class="pt-4 pb-4">Gerenciador de tarefas</h1>

  <div class="card p-3">

    <h3>Adicionar tarefa</h3>

    <div class="form-floating mb-2">
      <input type="text" class="form-control" id="tituloInput" placeholder="Título">
      <label for="tituloInput">Título</label>
    </div>

    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="descricaoInput" placeholder="Descrição">
      <label for="descricaoInput">Descrição</label>
    </div>

    <div class="dropdown mb-3">
      <button class="btn btn-info dropdown-toggle" type="button" data-bs-toggle="dropdown">
        Prioridade
      </button>
      <ul class="dropdown-menu">
        <li><button class="dropdown-item" onclick="setPrioridade('Alta')">Alta</button></li>
        <li><button class="dropdown-item" onclick="setPrioridade('Média')">Média</button></li>
        <li><button class="dropdown-item" onclick="setPrioridade('Baixa')">Baixa</button></li>
      </ul>
    </div>

    <button onclick="criaCard()" class="btn btn-primary">
      Adicionar tarefa
    </button>

  </div>

  <div class="Tarefas mt-4 d-flex flex-wrap gap-3"></div>

</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
