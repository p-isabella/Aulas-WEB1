<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

<div class="container">
  <div class="row justify-content-md-center linha1">
    <div class="col-12 col-md-4 titulo">
      <h1 class="title pt-4 pb-4 ">Gerenciador de tarefas</h1>
    </div>
    <div class="row justify-content-md-center">
        <div class="col-10">
        <div class="card">
            <div class="card-title col-2 col-md-4 m-3 mb-1"><h3>Adicionar tarefa</h3></div>
        <div class="card-body col-12">
                <div class="form-floating mb-2 m-2 col-4">
                <input class="form-control" id="floatingInput" placeholder="Tarefa">
                <label for="floatingInput" id="tituloTarefa">Título</label>
                </div>

                <div class="form-floating mb-3 m-2">
                <input class="form-control" id="floatingInput" placeholder="Tarefa">
                <label for="floatingInput" id="descricaoTarefa">Digite sua tarefa aqui</label>
                </div>

            <div class="row m-2">
            <button type="button" class="btn btn-primary col-2 btnAddTarefa">Adicionar tarefa</button>
            <div class="dropdown col-2">
                <div class="dropdown">
                <button class="btn btn-info dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Prioridade
                </button>
                <ul class="dropdown-menu rounded ">
                    <li><button class="dropdown-item bg-danger" id="prioridadeAlta">Alta</button></li>
                    <li><button class="dropdown-item bg-warning" id="prioridadeMedia">Média</button></li>
                    <li><button class="dropdown-item bg-success" id="prioridadeBaixa">Baixa</button></li>
                </ul>
                </div>
                </div>
            </div>    
        </div>
        </div>
      </div>
    </div>
    </div>

    <div class="row linha2">
        
    </div>
  </div>

  <div class="row justify-content-md-center Tarefas">
    <div class="row">
        <div class="col"></div>
    </div>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</html>
</body>
</html>
